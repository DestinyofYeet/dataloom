---
enable-email-notifications: false
name: "Upload to crates.io"
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN  }}

# defaults:
#   run:
#     shell:
#       nix develop --command bash {0}

jobs:
  publish_macro:
    runs-on: ubuntu
    defaults:
      run:
        working-directory: "./dataloom-macro"

    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Check tag"
        run: |
          cargo install toml-cli
          test "v$(toml get Cargo.toml package.version)" = "${{ github.ref_name }}"

      - name: "Publish macro"
        run: |
          cargo publish

  publish:
    runs-on: ubuntu
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Check tag"
        run: |
          cargo install toml-cli
          test "v$(toml get Cargo.toml package.version)" = "${{ github.ref_name }}"

      - name: "Publish code"
        run: |
          cargo publish
