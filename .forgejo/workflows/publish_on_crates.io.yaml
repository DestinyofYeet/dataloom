---
enable-email-notifications: false
name: "Upload to crates.io"
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN  }}

defaults:
  run:
    shell:
      nix develop --command bash {0}

jobs:
  publish_macro:
    runs-on: rust
    defaults:
      run:
        working-directory: "./dataloom-macro"

    steps:
      - uses: https://code.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "Check tag"
        run: |
          test "v$(nix run nixpkgs#toml-cli get Cargo.toml package.version)" = "${{ forgejo.ref_name }}"

      - name: "Publish macro"
        run: |
          cargo publish

  publish:
    runs-on: rust
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "Check tag"
        run: |
          test "v$(nix run nixpkgs#toml-cli get Cargo.toml package.version)" = "${{ forgejo.ref_name }}"

      - name: "Publish code"
        run: |
          cargo publish
