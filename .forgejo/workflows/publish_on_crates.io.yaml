---
enable-email-notifications: false
name: "Upload to crates.io"
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN  }}

defaults:
  run:
    shell:
      nix develop --command bash {0}

jobs:
  publish_macro:
    runs-on: native
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Publish macro"
        working-directory: "./dataloom-macro"
        run: |
          cargo publish

  publish:
    runs-on: native
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Publish code"
        run: |
          cargo publish
