---
enable-email-notifications: false
name: "Upload to crates.io"
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN  }}

jobs:
  publish_macro:
    runs-on: debian
    steps:      
      - uses: ./.forgejo/actions/docker_deps_setup
      - uses: ./.forgejo/actions/publish
        with:
          working-directory: "dataloom-macro"

  publish:
    runs-on: debian
    steps:      
      - uses: ./.forgejo/actions/docker_deps_setup
      - uses: ./.forgejo/actions/publish
        with:
          working-directory: "dataloom"
