---
enable-email-notifications: false
name: "Upload to crates.io"
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN  }}

jobs:
  publish_macro:
    runs-on: debian

    steps:
      - name: "Install deps"
        run: |
          apt update
          apt install -y git cargo nodejs

      - uses: https://code.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: "Check tag"
        working-directory: "dataloom-macro"
        run: |
          export PATH=$PATH:/root/.cargo/bin
          cargo install toml-cli
          [[ "v$(toml get Cargo.toml package.version -r)" = "${{ github.ref_name  }}" ]] || (echo "Failed to validate macro version. Does not match tag." && false)

      - name: "Publish macro"
        working-directory: "dataloom-macro"
        run: |
          cargo publish

  publish:
    runs-on: debian
    steps:
      - name: "Install deps"
        run: |
          apt update
          apt install -y git cargo nodejs

      - uses: https://code.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Check tag"
        run: |
          export PATH=$PATH:/root/.cargo/bin
          cargo install toml-cli
          test "v$(toml get Cargo.toml package.version -r)" = "${{ github.ref_name }}"
          [[ "v$(toml get Cargo.toml package.version -r)" = "${{ github.ref_name  }}" ]] || (echo "Failed to validate version. Does not match tag." && false)

      - name: "Publish code"
        run: |
          cargo publish
