---
enable-email-notifications: true
name: "Check"
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  check_commit_format:
    runs-on: native
    if: '! github.event.pull_request.draft'
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 0
      - run: |
          git checkout "${{ github.head_ref }}"
          git pull
      - name: Check commit format
        shell: "nix develop --command bash {0}"
        run: |
          cz check --rev-range origin/main..HEAD

  check_cargo_lock:
    runs-on: native
    if: '! github.event.pull_request.draft'
    steps:
      - name: "Fetch source"
        uses: https://code.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "Check lock file"
        shell: "nix develop --command bash {0}"
        run: |
          cargo update -w
          git diff --exit-code > lock_patch.diff

      - name: Upload patch diff
        if: failure()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: lock-patch
          path: lock_patch.diff
          show-progress: true
          overwrite: true

  check_cargo:
    runs-on: native
    if: '! github.event.pull_request.draft'
    steps:
      - name: "Fetch source"
        uses: https://code.forgejo.org/actions/checkout@v6

      - name: "Check licenses"
        shell: "nix develop --command bash {0}"
        run: |
          cargo deny check licenses

      - name: "Check advisories"
        shell: "nix develop --command bash {0}"
        run: |
          cargo deny check advisories

      - name: "Check cargo audit"
        shell: "nix develop --command bash {0}"
        run: |
          cargo audit

