name: Setup dependencies

runs:
  using: "composite"
  steps:
    - name: "Install deps"
      run: |        
          apt update
          apt install -y git nodejs curl xz
          curl --proto '=https' --tlsv1.2 -L https://nixos.org/nix/install | sh -s -- --daemon

    - name: "Checkout repository"
      uses: https://code.forgejo.org/actions/checkout@v7
      with:
        fetch-depth: 0
